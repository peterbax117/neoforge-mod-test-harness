name: Build and test

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      - name: Build
        run: ./gradlew build

      - name: Run GameTest self-tests
        run: ./gradlew runGameTestServer

      - name: Install virtual display
        run: sudo apt-get update && sudo apt-get install -y xvfb libgl1-mesa-dri

      - name: Run client self-tests
        run: xvfb-run -a -s "-screen 0 1280x720x24" ./gradlew clientTest

      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: client-test-report
          path: |
            build/clienttest/report.txt
            run/clienttest/logs/latest.log
