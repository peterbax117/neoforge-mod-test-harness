// Applied by a NeoForge mod build to use neoforge-mod-test-harness. See README.md for setup.
// Requires: the net.neoforged.moddev plugin, a mod_id property, and neoForge.mods.<mod_id> declared before applying.
//
// Adds:
//   src/gametest    GameTests, run headless with: gradlew runGameTestServer
//   src/clienttest  scripted client tests, run with: gradlew clientTest
// Neither source set is packaged into the mod jar.

def harnessCoordinates = 'io.github.peterbax117:neoforge-mod-test-harness:0.2.0'
def clientTestReport = layout.buildDirectory.file('clienttest/report.txt')

sourceSets {
    gametest {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
    clienttest {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}

dependencies {
    gametestImplementation harnessCoordinates
    clienttestImplementation harnessCoordinates
}

neoForge.addModdingDependenciesTo(sourceSets.gametest)
neoForge.addModdingDependenciesTo(sourceSets.clienttest)

neoForge.mods.named(project.mod_id).configure {
    sourceSet(sourceSets.gametest)
    sourceSet(sourceSets.clienttest)
}

neoForge.runs {
    // Headless server that runs every GameTest and exits; the exit code is the number of failed required tests.
    // NeoForge filters tests by template namespace, so the harness namespace is enabled for its shared templates.
    gameTestServer {
        type = 'gameTestServer'
        sourceSet = sourceSets.gametest
        systemProperty 'neoforge.enabledGameTestNamespaces', "${project.mod_id},modtestharness"
    }

    // Real client that runs every @ClientTest, writes a report and exits. Use the clientTest task.
    clientTest {
        client()
        sourceSet = sourceSets.clienttest
        gameDirectory = project.file('run/clienttest')
        systemProperty 'modtestharness.clienttest.report', clientTestReport.get().asFile.absolutePath
    }
}

tasks.matching { it.name == 'runClientTest' }.configureEach {
    def report = clientTestReport
    doFirst { report.get().asFile.delete() }
}

tasks.register('clientTest') {
    group = 'verification'
    description = 'Runs the scripted client tests and fails unless every test passed.'
    dependsOn 'runClientTest'
    def report = clientTestReport
    doLast {
        def file = report.get().asFile
        if(!file.exists()) throw new GradleException("Client tests wrote no report to ${file}")
        def text = file.text
        println text
        if(!text.startsWith('PASS')) throw new GradleException("Client tests failed, see ${file}")
    }
}
